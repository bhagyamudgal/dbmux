name: Release

on:
    push:
        branches:
            - main

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: false

jobs:
    version:
        name: Open Version Pull Request
        runs-on: ubuntu-latest

        permissions:
            contents: write
            pull-requests: write

        outputs:
            has-changesets: ${{ steps.changesets.outputs.has-changesets }}
            version: ${{ steps.package.outputs.version }}
            is-released: ${{ steps.released.outputs.is-released }}

        steps:
            - name: Checkout code
              uses: actions/checkout@v4
              with:
                  fetch-depth: 0

            - name: Setup Bun
              uses: oven-sh/setup-bun@v2
              with:
                  bun-version: latest

            - name: Cache Bun dependencies
              uses: actions/cache@v4
              with:
                  path: ~/.bun/install/cache
                  key: ${{ runner.os }}-bun-${{ hashFiles('**/bun.lock') }}
                  restore-keys: |
                      ${{ runner.os }}-bun-

            - name: Install dependencies
              run: bun install --frozen-lockfile

            - name: Collect changesets into a version pull request
              id: changesets
              uses: changesets/action@v2
              with:
                  commit-message: "chore: version packages"
                  pr-title: "chore: version packages"

            - name: Read the version on main
              id: package
              run: echo "version=$(node -p "require('./packages/cli/package.json').version")" >> "$GITHUB_OUTPUT"

            # Every push to main without pending changesets reaches the publish
            # job, so the existing tag is what distinguishes "the version pull
            # request just merged" from "an unrelated commit landed".
            - name: Check whether that version is already tagged
              id: released
              env:
                  VERSION: ${{ steps.package.outputs.version }}
              run: |
                  if git rev-parse -q --verify "refs/tags/v$VERSION" >/dev/null; then
                      echo "is-released=true" >> "$GITHUB_OUTPUT"
                  else
                      echo "is-released=false" >> "$GITHUB_OUTPUT"
                  fi

    publish:
        name: Publish and Release
        needs: version
        if: needs.version.outputs.has-changesets == 'false' && needs.version.outputs.is-released == 'false'
        runs-on: ubuntu-latest

        permissions:
            contents: write
            id-token: write

        env:
            VERSION: ${{ needs.version.outputs.version }}

        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Setup Bun
              uses: oven-sh/setup-bun@v2
              with:
                  bun-version: latest

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: "22"

            - name: Upgrade npm for OIDC support
              run: npm install -g npm@latest

            - name: Cache Bun dependencies
              uses: actions/cache@v4
              with:
                  path: ~/.bun/install/cache
                  key: ${{ runner.os }}-bun-${{ hashFiles('**/bun.lock') }}
                  restore-keys: |
                      ${{ runner.os }}-bun-

            - name: Install dependencies
              run: bun install --frozen-lockfile

            - name: Build project
              run: bun run build

            - name: Build cross-platform binaries
              run: bun run build:binaries

            - name: Create checksums
              run: |
                  cd packages/cli/binaries
                  sha256sum -- * > checksums.txt
                  cat checksums.txt

            - name: Create GitHub Release
              uses: softprops/action-gh-release@v2
              with:
                  tag_name: v${{ env.VERSION }}
                  name: Release ${{ env.VERSION }}
                  body: |
                      ## dbmux ${{ env.VERSION }}

                      See [CHANGELOG.md](https://github.com/bhagyamudgal/dbmux/blob/main/packages/cli/CHANGELOG.md) for what changed.

                      ### Installation

                      **Quick Install (Recommended):**
                      ```bash
                      curl -fsSL https://raw.githubusercontent.com/bhagyamudgal/dbmux/main/install.sh | bash
                      ```

                      **Via npm:**
                      ```bash
                      npm install -g dbmux
                      # or
                      bun add -g dbmux
                      ```

                      **Via Binary Download:**

                      | Platform | Binary |
                      |----------|--------|
                      | Linux (x64) | `dbmux-linux-x64` |
                      | macOS (Intel) | `dbmux-darwin-x64` |
                      | macOS (Apple Silicon) | `dbmux-darwin-arm64` |
                      | Windows (x64) | `dbmux-windows-x64.exe` |

                      ```bash
                      # Linux/macOS
                      chmod +x dbmux-*
                      sudo mv dbmux-* /usr/local/bin/dbmux
                      dbmux --help
                      ```

                      ### Verification

                      Verify downloads using `checksums.txt` (SHA256).
                  draft: false
                  prerelease: false
                  files: |
                      packages/cli/binaries/dbmux-linux-x64
                      packages/cli/binaries/dbmux-darwin-x64
                      packages/cli/binaries/dbmux-darwin-arm64
                      packages/cli/binaries/dbmux-windows-x64.exe
                      packages/cli/binaries/checksums.txt

            - name: Copy README and LICENSE for npm package
              run: cp README.md LICENSE packages/cli/

            - name: Publish to npm (Trusted Publishing)
              run: npm publish --provenance --access public
              working-directory: packages/cli
